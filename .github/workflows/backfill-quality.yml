name: backfill-quality

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-build
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild historical batches at v2 quality
        run: |
          cd pipeline && python3 backfill.py && cd ..

      - name: Quality gate over full catalog
        run: python3 pipeline/quality_gate.py

      - name: Commit upgraded archive
        run: |
          bash .github/scripts/commit-push.sh "backfill: entire catalog regenerated at v2 quality [skip ci]"
