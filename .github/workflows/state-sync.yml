name: state-sync

# Autonomous LIVE HEALTH reporter. Writes metrics/live-health.md with
# ground-truth live facts and commits it, so ANY session/agent can read the
# freshest state from the repo at any time (no local run needed).
# Free: GitHub Actions cron, $0. Idempotent.
#
# This workflow also HOSTS jobs added after GitHub stopped assigning cron
# schedules to brand-new workflows. Newly created workflows did not receive a
# schedule for hours after creation, so anything time-critical was parked here,
# where the cron is already assigned and running. The standalone workflow files
# still exist and work; they are simply not the scheduling mechanism.

on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC daily
  workflow_dispatch:        # manual / on-demand refresh

permissions:
  contents: write

# No concurrency group: this workflow hosts several independent jobs, and a
# shared group meant one slow job (the chain scan) held up the rest. Each job
# is independently idempotent, so overlapping runs are safe.

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate LIVE HEALTH report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pipeline/sync_state.py

      - name: Commit report
        run: bash .github/scripts/commit-push.sh "live health report [skip ci]" metrics/live-health.md

  # ---------------------------------------------------------------------------
  # Payment watcher (relocated from checkout.yml)
  # ---------------------------------------------------------------------------
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline selftest (money math must be right before real funds)
        run: python3 pipeline/checkout.py --selftest

      - name: Ensure invoices exist for every product
        env:
          VF_PAYOUT_ADDRESS: ${{ vars.VF_PAYOUT_ADDRESS }}
        run: python3 pipeline/checkout.py --init

      - name: Scan chain and confirm payments
        env:
          VF_PAYOUT_ADDRESS: ${{ vars.VF_PAYOUT_ADDRESS }}
        run: python3 pipeline/checkout.py --watch

      - name: Commit checkout state + earnings
        run: bash .github/scripts/commit-push.sh "checkout: payment watcher state + earnings" checkout/ metrics/earnings.json

  # ---------------------------------------------------------------------------
  # Catalog hygiene (relocated from catalog-hygiene.yml)
  # ---------------------------------------------------------------------------
  catalog-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify theme rotation produces distinct themes per season
        run: python3 pipeline/verify_theme_rotation.py

      - name: Repair duplicate titles
        run: python3 pipeline/backfill_titles.py

      - name: Report title uniqueness
        run: python3 pipeline/report_title_uniqueness.py

      - name: Commit repaired catalog
        run: bash .github/scripts/commit-push.sh "catalog: unique titles and refreshed theme tags" catalog/ metrics/

  # ---------------------------------------------------------------------------
  # Search-engine submission (relocated from indexnow.yml)
  # ---------------------------------------------------------------------------
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: python3 pipeline/indexnow_submit.py

  # ---------------------------------------------------------------------------
  # Repository discovery surface (relocated from repo-surface.yml)
  # ---------------------------------------------------------------------------
  repo-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Apply repository topics and description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/apply-repo-surface.sh

      - name: Verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/check-repo-surface.sh
