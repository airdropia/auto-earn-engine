name: ccheck
on:
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify theme rotation
        run: python3 pipeline/verify_theme_rotation.py
      - name: Repair titles
        run: python3 pipeline/backfill_titles.py
      - name: Report
        run: python3 pipeline/report_title_uniqueness.py
      - name: Commit
        run: bash .github/scripts/commit-push.sh 'catalog: unique titles' catalog/ metrics/
