name: weekly-compilation

# AUDIT.md P4: best-of-week mega-bundle for long-tail SEO + "one download,
# all designs" appeal. Runs on Mondays (UTC) shortly after the daily
# 03:30 cron so the week's last batch is included.
#
# Free - GitHub Actions cron, $0 cost.

on:
  schedule:
    - cron: "0 5 * * 1"  # Monday 05:00 UTC
  workflow_dispatch:       # manual trigger for testing

permissions:
  contents: write

concurrency:
  group: production-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build weekly compilation bundle
        run: python3 pipeline/weekly_compilation.py

      - name: Quality gate
        run: python3 pipeline/quality_gate.py

      - name: Build storefront
        run: python3 pipeline/build_site.py

      - name: Commit weekly bundle
        run: |
          git config user.name "auto-earn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "weekly compilation $(date -u +%G-W%V) [skip ci]" && git push)
