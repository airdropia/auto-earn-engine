name: flagship-test
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate flagship design
        run: python3 pipeline/flagship_generator.py
      - name: Generate memorial design (emotional line)
        run: python3 pipeline/memorial_generator.py
      - name: Issue invoices for the new products
        env:
          VF_PAYOUT_ADDRESS: ${{ vars.VF_PAYOUT_ADDRESS }}
        run: python3 pipeline/checkout.py --init
      - name: Quality gate
        run: python3 pipeline/quality_gate.py
      - name: Render delivery pages for issued orders
        run: python3 pipeline/delivery.py
      - name: Build storefront (per-product pages + sitemap)
        run: python3 pipeline/build_site.py
      - name: Commit generator outputs
        run: |
          bash .github/scripts/commit-push.sh "flagship design [skip ci]" site_extra/ checkout/ catalog/ products/
      - name: Verify site artifact exists
        run: |
          ls -la site/ | head -20
          find site/products/2026-09-16/flagship-* -name '*.svg' | head
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
