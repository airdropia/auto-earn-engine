name: flagship-test
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Byte-compile the pipeline (fail fast on syntax errors)
        run: python3 -m compileall -q pipeline
      - name: Generate flagship design
        run: python3 pipeline/flagship_generator.py
      - name: Generate memorial design (emotional line)
        run: python3 pipeline/memorial_generator.py
      - name: Render high-res PNG for new designs (6500px)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          for svg in products/*/*/*-design-1.svg; do
            [ -f "$svg" ] || continue
            dir=$(dirname "$svg")
            id=$(basename "$dir")
            print="$dir/${id}-6500.png"
            thumb="$dir/${id}-1000.png"
            # 1000px web thumbnail: phones do not render inline SVG, and the
            # 6500px print render is far too heavy to load in a page.
            if [ ! -f "$thumb" ]; then
              rsvg-convert -w 1000 -h 1000 --background-color '#ffffff' "$svg" -o "$thumb"
              echo "thumbnail: ${id}-1000.png ($(du -h "$thumb" | cut -f1))"
            fi
            if [ ! -f "$print" ]; then
              rsvg-convert -w 6500 -h 6500 --background-color '#ffffff' "$svg" -o "$print"
              echo "rendered: ${id}-6500.png ($(du -h "$print" | cut -f1))"
            fi
          done
      - name: Issue invoices for the new products
        env:
          VF_PAYOUT_ADDRESS: ${{ vars.VF_PAYOUT_ADDRESS }}
        run: python3 pipeline/checkout.py --init
      - name: Quality gate
        run: python3 pipeline/quality_gate.py
      - name: Render delivery pages for issued orders
        run: python3 pipeline/delivery.py
      - name: Build storefront (per-product pages + sitemap)
        run: python3 pipeline/build_site.py
      - name: Commit generator outputs
        run: |
          bash .github/scripts/commit-push.sh "flagship design [skip ci]" site_extra/ checkout/ catalog/ products/
      - name: Verify site artifact exists
        run: |
          ls -la site/ | head -20
          find site/products/2026-09-16/flagship-* -name '*.svg' | head
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
