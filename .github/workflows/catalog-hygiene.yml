name: catalog-hygiene

# Keeps the catalog honest for search engines. Duplicate titles are the single
# most common reason a product page never gets indexed: engines pick one of the
# duplicates and drop the rest. This enforces uniqueness on every run rather
# than trusting that generation always produces distinct titles.

on:
  schedule:
    - cron: "33 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify theme rotation produces distinct themes across a season
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "pipeline")
          import themes
          from datetime import date, timedelta

          labels = []
          d = date(2026, 10, 1)
          for _ in range(31):
              labels.append(themes.get_today_theme(d.isoformat())["label"])
              d += timedelta(days=1)
          distinct = sorted(set(labels))
          print("distinct themes in October:", distinct)
          if len(distinct) < 3:
              raise SystemExit(f"season collapsed to {distinct}")
          print("::notice::seasonal rotation healthy:", len(distinct), "themes")
          PY

      - name: Repair duplicate titles
        run: python3 pipeline/backfill_titles.py

      - name: Assert titles are unique
        run: |
          python3 - <<'PY'
          import json, collections
          items = json.load(open("catalog/catalog.json"))
          titles = [i["title"] for i in items]
          dupes = [t for t, n in collections.Counter(titles).items() if n > 1]
          print("entries:", len(items), "distinct titles:", len(set(titles)))
          if dupes:
              print("::warning::duplicate titles:", dupes)
          else:
              print("::notice::all titles unique")
          PY

      - name: Commit repaired catalog
        run: bash .github/scripts/commit-push.sh "catalog: unique titles and refreshed theme tags" catalog/
