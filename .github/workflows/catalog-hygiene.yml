name: catalog-hygiene

# Keeps the catalog honest for search engines. Duplicate titles are the single
# most common reason a product page never gets indexed: engines pick one of the
# duplicates and drop the rest. This enforces uniqueness on every run rather
# than trusting that generation always produces distinct titles.

on:
  schedule:
    - cron: "33 6 * * *"   # 06:33 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify theme rotation produces distinct themes per season
        run: python3 pipeline/verify_theme_rotation.py

      - name: Repair duplicate titles
        run: python3 pipeline/backfill_titles.py

      - name: Report title uniqueness
        run: python3 pipeline/report_title_uniqueness.py

      - name: Commit repaired catalog
        run: bash .github/scripts/commit-push.sh "catalog: unique titles and refreshed theme tags" catalog/
