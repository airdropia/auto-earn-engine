name: bounty-monitor

# Zero-user crypto-bounty monitor (Superteam Earn).
# Polls the PUBLIC listings API every 6h, filters agentAccess==AGENT_ALLOWED,
# diffs vs state file, appends new bounties to metrics/bounties.md, commits.
# HUMAN_ONLY bounties are never touched (ToS honesty). $0 cost, GitHub-only.

on:
  schedule:
    - cron: "23 */6 * * *"  # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan Superteam Earn open bounties
        run: |
          set -e
          curl -s --max-time 30 -H "User-Agent: Mozilla/5.0" \
            "https://superteam.fun/api/listings?status=open" -o /tmp/listings.json
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/listings.json','utf8')).length)" 2>/dev/null || echo 0)
          echo "Open listings fetched: $COUNT"
          if [ "$COUNT" = "0" ]; then
            echo "::warning::Listings API returned 0 items — API may have changed."
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const all = JSON.parse(fs.readFileSync('/tmp/listings.json','utf8'));
            const agents = all.filter(x => x.agentAccess === 'AGENT_ALLOWED');
            let lines = agents.map(x =>
              '| ' + x.rewardAmount + ' ' + x.token +
              ' | ' + x.deadline.slice(0,10) +
              ' | ' + x.title.replace(/\|/g,'/') +
              ' | https://superteam.fun/earn/listings/' + x.slug +
              ' | ' + x.id + ' |'
            );
            let state = [];
            if (fs.existsSync('metrics/bounties.md')) {
              state = fs.readFileSync('metrics/bounties.md','utf8').split('\n').filter(l => l.includes('superteam.fun/earn/listings/'));
            }
            const seen = new Set(state.map(l => l.split('|').map(s=>s.trim()).pop()));
            const fresh = lines.filter(l => { const id = l.split('|').map(s=>s.trim()).pop(); return !seen.has(id); });
            if (fresh.length === 0) { console.log('No new AGENT_ALLOWED bounties.'); process.exit(0); }
            if (!fs.existsSync('metrics/bounties.md')) {
              fs.writeFileSync('metrics/bounties.md',
                '# Crypto Bounty Pipeline (agent-allowed only)\n\n' +
                'Source: Superteam Earn public API. HUMAN_ONLY bounties excluded.\n\n' +
                '| Reward | Deadline | Title | Link | ID |\n|---|---|---|---|---|\n');
            }
            fs.appendFileSync('metrics/bounties.md', fresh.join('\n') + '\n');
            console.log('Appended ' + fresh.length + ' new agent-allowed bounties:');
            fresh.forEach(l => console.log(l));
          "

      - name: Commit bounty updates
        run: |
          if [ -f metrics/bounties.md ] && ! git diff --quiet HEAD -- metrics/bounties.md || ! git ls-files --error-unmatch metrics/bounties.md >/dev/null 2>&1 && [ -s metrics/bounties.md ]; then
            git config user.name "auto-earn-bot"
            git config user.email "actions@users.noreply.github.com"
            git add metrics/bounties.md
            git commit -m "bounty: new agent-allowed listings detected [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
