name: awesome-submit

# Legitimate open-source discovery, automated.
#
# Curated "awesome-*" lists are the one promotion channel that is genuinely
# free, needs no account, and involves no human on our side: we open a pull
# request and the maintainer decides. This job finds lists that plausibly match
# the project, and opens a PR only where one does not already exist.
#
# Guard rails, because this touches other people's repositories:
#  - only forks repos we do not own, so we never push to upstream
#  - a target must literally be named awesome-* (loose full-text search
#    matched Font-Awesome and SQL dumps once; that must not recur)
#  - skips lists that already reviewed us, merged or rejected
#    (ad-si/awesome-laser-cutting and kosmos/awesome-generative-art were
#    both closed unmerged on 2026-10-14/15 — do not re-approach)
#  - never opens more than MAX_NEW_PER_RUN PRs per run
#  - every PR states plainly what the project is (MIT generator) and links
#    the storefront as the live output catalog — no "free" wording
#
# Cross-repo writes (fork push, PR creation) need an account-wide token:
# the workflow GITHUB_TOKEN is scoped to this repo only, which made the
# first real run die with git exit 128. The PAT lives in the VF_GH_PAT
# secret and is never echoed.

on:
  schedule:
    - cron: "17 8 * * *"   # 08:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VF_GH_PAT: ${{ secrets.VF_GH_PAT }}
  PROJECT_URL: https://github.com/airdropia/auto-earn-engine
  CATALOG_URL: https://airdropia.github.io/auto-earn-engine/
  ENTRY_NAME: "VectorForge Daily"
  MAX_NEW_PER_RUN: "3"

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover candidate curated lists
        id: discover
        run: |
          set -euo pipefail
          # in:name is doing the real filtering here; the words only widen the
          # net. The craft-specific queries were added because a Cricut maker
          # reads "cricut svg" or "papercraft" repos, not only "awesome-" ones,
          # and those repos are the same buyer.
          QUERIES="awesome+laser+cutting awesome+generative+art awesome+paper+craft awesome+svg awesome+cricut awesome+cut+files awesome+diy awesome+maker+tools awesome+crafts cricut+svg papercraft laser+cutting+projects craft+svg shadow+box+svg svg+cut+files cricut+templates cricut+ideas"
          : > candidates.txt
          for q in $QUERIES; do
            # Use the account PAT, not the repo-scoped GITHUB_TOKEN: 16 rapid
            # searches in a row trip GitHub's secondary rate limit on the
            # Actions token, and the failure was invisible because stderr went
            # to /dev/null — the run then reported "candidates: 0" and looked
            # like there was simply nothing left to submit.
            err=$(GH_TOKEN="$VF_GH_PAT" gh api "search/repositories?q=$q+in:name+archived:false+fork:false&sort=stars&order=desc&per_page=12" \
              --jq '.items[] | "\(.stargazers_count)\t\(.full_name)\t\(.default_branch)\t\(.description // "")"' \
              2>&1 >/tmp/q.out) || true
            n=$(wc -l < /tmp/q.out)
            # Diagnostics must go to stderr: this loop's stdout is piped into
            # sort, so a plain echo would land in the TSV as a junk row and
            # every real candidate would then fail the integer test silently.
            echo "query [$q] -> $n rows${err:+ ERROR: $err}" >&2
            # The rows themselves go to stdout: that is what the pipeline
            # collects into the candidate TSV.
            cat /tmp/q.out
            sleep 2
          done | sort -u -k2,2 > all_candidates.tsv
          echo "raw candidate rows: $(wc -l < all_candidates.tsv)"

          # A submission target is a repository whose NAME starts with
          # "awesome". Everything else that matched the words (icon kits,
          # unrelated tools) is filtered out here.
          # The raw TSV holds stars/full_name/branch/description (exactly what
          # the search returns). `kind` is added only when writing
          # candidates.txt, so reading five fields here would shift every
          # column by one and silently drop every candidate.
          while IFS=$'\t' read -r stars full branch desc; do
            [ -z "${full:-}" ] && continue
            [ "${stars:-0}" -ge 50 ] || continue
            case "$full" in airdropia/*) continue ;; esac
            base_lc="$(printf '%s' "${full##*/}" | tr '[:upper:]' '[:lower:]')"
            # Two classes of target qualify:
            #   1. curated lists (basename starts with awesome-)
            #   2. craft repos that carry an explicit making/Cricut/SVG topic
            # Class 2 needs a higher star floor because we are not editing a
            # list whose whole purpose is to collect tools — we are adding to
            # someone's project repo, which is the easiest way to get an
            # account flagged as spam.
            kind=""
            # Curated lists qualify when the name STARTS with "awesome-" or ENDS with
            # "-awesome" (image2svg-awesome). Do not use a *-awesome-* pattern
            # to mean "ends with": that glob matches any name CONTAINING
            # "-awesome-", which is how Font-Awesome-SVG-PNG (an icon
            # converter, not a list) got a storefront PR opened against it.
            case "$base_lc" in awesome-*|*-awesome) kind="list" ;; esac
            if [ -z "$kind" ]; then
              topics_lc=$(GH_TOKEN="$VF_GH_PAT" gh api "repos/$full/topics" --jq '.names | join(" ")' 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
              # Only genuinely adjacent targets. Papercraft template
              # collections and generic "svg" repos match by vocabulary but a
              # shop link is off-topic there, and an off-topic PR is worse than
              # no PR: it burns the one submission a maintainer will ever read.
              case "$base_lc" in
                *cricut*|*laser*|*cut-file*|*cutfile*|*shadow-box*|*silhouette*|*die-cut*|*stencil*) kind="craft" ;;
              esac
              if [ -z "$kind" ]; then
                case "$topics_lc" in
                  *cricut*|*laser-cutting*|*lasercutting*|*shadow-box*|*cricutting*|*die-cut*|*diecut*)
                    kind="craft" ;;
                  *) continue ;;
                esac
              fi
              [ "${stars:-0}" -ge 100 ] || continue
            fi
            # Lists that already reviewed us stay skipped forever.
            case "$full" in ad-si/awesome-laser-cutting|kosmos/awesome-generative-art) continue ;; esac
            # Any previous PR by this account (open, closed or merged) means
            # the list already knows us; a duplicate submission is noise.
            # The full "search/issues" path is required: a bare "search/..."
            # is a 404, and the || echo 0 swallowed it, so every target with
            # a prior PR looked like a fresh one.
            prior=$(GH_TOKEN="$VF_GH_PAT" gh api "search/issues?q=repo:$full+is:pr+author:airdropia" --jq '.total_count' 2>/dev/null)
            if [ "${prior:-1}" != "0" ]; then
              echo "skip $full — prior PR by this account (${prior:-query failed})"
              continue
            fi
            # Rank by whether the target actually invites pull requests. A list whose
            # README says "contributions welcome" has told us it will read a
            # PR; one that does not is a coin flip, and we only get a limited
            # number of submissions per day, so the invitation decides.
            score=0
            # Fetch the README raw. The JSON body's base64 "content" field is
            # newline-escaped every 60 characters, so extracting it with sed
            # yields a truncated fragment (measured: 45 bytes instead of
            # 2691) and the invitation check silently never matches.
            readme_text=$(GH_TOKEN="$VF_GH_PAT" gh api "repos/$full/readme" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
            if [ -n "$readme_text" ]; then
              if printf '%s' "$readme_text" | grep -qiE "pull requests? welcome|prs? welcome|contributions? welcome|feel free to (open|add)|open a pull request|add your (own )?|how to contribute|contributing"; then
                score=$((score + 3))
              fi
              if printf '%s' "$readme_text" | grep -qiE "^#+ *(resources|tools|related|see also|libraries|free|external)"; then
                score=$((score + 1))
              fi
            fi
            # `if`, not `[ ... ] && score=...`: a false test would return
            # non-zero and, under the step's `set -e`, kill the whole run.
            if [ "${stars:-0}" -ge 1000 ]; then
              score=$((score + 1))
            fi
            printf '%s\t%s\t%s\t%s\t%.120s\t%s\n' "$stars" "$kind" "$full" "$branch" "$desc" "$score" >> candidates.txt
          done < all_candidates.tsv

          echo "candidates: $(wc -l < candidates.txt)"
          # Best invitation score first, then stars.
          sort -t"$(printf '\t')" -k6,6nr -k1,1nr candidates.txt -o candidates.txt || true
          cut -f1-4 candidates.txt || true

      - name: Open pull requests where an entry is missing
        run: |
          set -uo pipefail
          if [ -z "${VF_GH_PAT:-}" ]; then
            echo "::warning::VF_GH_PAT secret missing — cross-repo push/PR impossible, skipping submit"
            exit 0
          fi
          echo "VF_GH_PAT loaded (length ${#VF_GH_PAT})"
          opened=0
          while IFS=$'\t' read -r stars kind full branch desc; do
            [ -z "${full:-}" ] && continue
            [ "$opened" -ge "$MAX_NEW_PER_RUN" ] && break

            name="${full##*/}"

            # Already present upstream? Then there is nothing to do.
            # The /readme endpoint resolves the real casing (Readme.md, ...).
            readme_json=$(gh api "repos/$full/readme" 2>/dev/null) || {
              echo "skip $full — no README found"; continue;
            }
            readme_path=$(printf '%s' "$readme_json" | sed -n 's/^.*"name":"\([^"]*\)".*$/\1/p' | head -1)
            if [ -z "$readme_path" ]; then
              echo "skip $full — could not parse README name"
              continue
            fi
            readme_content=$(printf '%s' "$readme_json" | sed -n 's/^.*"content":"\([^"]*\)".*$/\1/p' | head -1)
            if [ -n "$readme_content" ] && printf '%s' "$readme_content" \
               | tr -d '\n' | base64 -d 2>/dev/null | grep -qi "$ENTRY_NAME"; then
              echo "skip $full — entry already present"
              continue
            fi

            echo "forking $full"
            fork="airdropia/$name"
            # A fork under our name may already exist for a DIFFERENT upstream
            # (repo names collide: awesome-generative-art exists as a fork of
            # kosmos while we are targeting camilleroux). PRs can only come
            # from a fork of the target repo, so verify the parent and rebuild
            # the fork from scratch when it is the wrong one. This also avoids
            # the fork API's numbered duplicates (name-1, name-2, ...).
            parent=$(GH_TOKEN="$VF_GH_PAT" gh api "repos/$fork" --jq '.parent.full_name // empty' 2>/dev/null || true)
            if [ "$parent" != "$full" ]; then
              if [ -n "$parent" ]; then
                GH_TOKEN="$VF_GH_PAT" gh api -X DELETE "repos/$fork" >/dev/null 2>&1 || true
                sleep 3
              fi
              GH_TOKEN="$VF_GH_PAT" gh api -X POST "repos/$full/forks" >/dev/null 2>&1 || true
              sleep 6   # a brand-new fork needs a moment to provision
            fi

            workdir="$RUNNER_TEMP/fork-$name"
            rm -rf "$workdir"
            # Clone the UPSTREAM tree, not the fork: a fork's default branch
            # can differ from the upstream's (this repo's fork sits on master
            # while upstream uses main), and pushing a fork-clone onto the
            # upstream branch name is then a non-fast-forward rejection.
            if ! GH_TOKEN="$VF_GH_PAT" gh repo clone "$full" "$workdir" >/dev/null 2>&1; then
              echo "skip $full — upstream clone failed"
              continue
            fi

            entry="- [$ENTRY_NAME]($PROJECT_URL) — MIT-licensed, dependency-free Python pipeline that generates memorial shadow box SVGs with an editable name plate (you type the name inside Cricut, no custom order needed) plus original 7-layer mandala bundles; one file per physical layer, 6500px PNG renders, quality gates and a static storefront, running entirely on GitHub Actions."
            if ! (
              set -euo pipefail
              cd "$workdir"
              # The clone came from upstream; redirect origin to OUR fork
              # before pushing (upstream itself denies us, by design).
              git remote set-url origin "https://github.com/$fork.git"
              git config user.name "airdropia"
              git config user.email "x2newd@gmail.com"
              printf '\n%s\n' "$entry" >> "$readme_path"
              git add "$readme_path"
              git commit -q -m "Add $ENTRY_NAME to curated list"
              # Authenticate the push with an explicit extraheader instead of
              # gh auth setup-git: on a fresh runner gh has no active account,
              # and the helper would resolve credentials from the workflow
              # GITHUB_TOKEN, which is denied 403 on other repositories.
              # Force: the fork branch is our own scratch staging area, and
              # forks can carry stale history that would otherwise reject a
              # fast-forward from upstream's tip.
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$VF_GH_PAT" | base64 | tr -d '\n')" \
                  push -qf origin "HEAD:refs/heads/$branch"
            ); then
              echo "skip $full — edit/push failed"
              continue
            fi

            body="Adds **$ENTRY_NAME** to this curated list."$'\n\n'"$desc"$'\n\n'"$PROJECT_URL is the generator: a self-contained Python pipeline (standard library only, no pip installs) that procedurally designs 7-layer shadow-box SVG mandalas, renders 6500px PNGs, gates quality and deploys a static storefront on scheduled GitHub Actions. The code is MIT-licensed."$'\n\n'"Live output catalog: $CATALOG_URL"$'\n'"Source: $PROJECT_URL"$'\n\n'"No signup or account required."

            url=$(GH_TOKEN="$VF_GH_PAT" gh pr create --repo "$full" \
                  --head "airdropia:$branch" --base "$branch" \
                  --title "Add $ENTRY_NAME" \
                  --body "$body" 2>&1 | tail -1)
            if [ $? -ne 0 ]; then
              echo "skip $full — pr create failed: $url"
              continue
            fi
            echo "opened: $url"
            opened=$((opened+1))
            rm -rf "$workdir"
          done < candidates.txt

          echo "PRs opened this run: $opened"
          echo "::notice::awesome-submit opened $opened PR(s)"
