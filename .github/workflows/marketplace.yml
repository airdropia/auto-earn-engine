name: marketplace-prep

# Turns every flagship product into marketplace-ready listing assets
# (Creative Fabrica + Etsy): listing.txt, keywords.txt, README.txt per product.
# Runs on GitHub Actions (user rule: local machine = operating window only,
# GitHub = free unlimited compute). Idempotent, [skip ci] to avoid loops.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["flagship-test"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: marketplace-prep
  cancel-in-progress: false

jobs:
  prep:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Generate marketplace listing assets
        run: bun pipeline/marketplace_prep.js

      - name: Render high-res PNG previews (6500px, vector lossless)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          mkdir -p /tmp/pngs
          # Every product type, not just flagship: the memorial line ships the
          # same combined SVG and a buyer decides from the image, not the slug.
          for svg in products/*/*/*-design-1.svg; do
            [ -f "$svg" ] || continue
            id=$(basename "$(dirname "$svg")")
            out="$(dirname "$svg")/${id}-6500.png"
            # Skip unchanged work so repeat runs stay cheap and idempotent.
            if [ -f "$out" ] && [ "$out" -nt "$svg" ]; then
              echo "cached: ${id}-6500.png"
              continue
            fi
            rsvg-convert -w 6500 -h 6500 --background-color '#ffffff' "$svg" \
              -o "/tmp/pngs/${id}-6500.png"
            cp "/tmp/pngs/${id}-6500.png" "$out"
            echo "rendered: ${id}-6500.png ($(du -h "/tmp/pngs/${id}-6500.png" | cut -f1))"
          done

      - name: Render brand profile pic (1024x1024, newest product)
        run: |
          # Glob for a product directory without a trailing slash: with one,
          # $latest ends in '/' and $latest$(basename ...) produced a path
          # that never existed, failing test -f.
          latest=$(ls -d products/*/*/ | sort | tail -1)
          latest=${latest%/}
          svg="$latest/$(basename "$latest")-design-1.svg"
          echo "profile pic source: $svg"
          test -f "$svg" || { echo "no product found for profile pic"; exit 0; }
          mkdir -p site_extra/brand
          rsvg-convert -w 1024 -h 1024 --background-color '#ffffff' "$svg" \
            -o site_extra/brand/profile-pic.png
          ls -la site_extra/brand/

      - name: Commit listing assets
        run: 'bash .github/scripts/commit-push.sh "brand: profile pic + marketplace assets [skip ci]" products/ site_extra/'
